<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Anton','Arial Narrow',sans-serif">
  <!-- dusk sky -->
  <rect width="800" height="560" fill="#1E3A2F"/>
  <!-- gold dusk band on horizon -->
  <rect x="0" y="430" width="800" height="50" fill="#D19A3E" opacity="0.28"/>
  <!-- stars -->
  <g fill="#D19A3E">
    <circle cx="90" cy="70" r="3"/><circle cx="150" cy="120" r="2"/><circle cx="230" cy="60" r="2.5"/>
    <circle cx="560" cy="70" r="2.5"/><circle cx="720" cy="150" r="2"/><circle cx="640" cy="40" r="2"/>
  </g>
  <!-- moon -->
  <circle cx="690" cy="95" r="40" fill="#FBF4E4"/>
  <circle cx="672" cy="88" r="40" fill="#1E3A2F"/>
  <!-- sidewalk -->
  <rect x="0" y="474" width="800" height="86" fill="#F1E7CE"/>
  <rect x="0" y="474" width="800" height="6" fill="#241C14"/>
  <g stroke="#241C14" stroke-width="2" opacity="0.35">
    <line x1="180" y1="480" x2="180" y2="560"/><line x1="400" y1="480" x2="400" y2="560"/><line x1="620" y1="480" x2="620" y2="560"/>
  </g>
  <!-- building facade -->
  <rect x="120" y="175" width="560" height="299" fill="#8E2B20"/>
  <!-- brick lines -->
  <g stroke="#241C14" stroke-width="1.5" opacity="0.18">
    <line x1="120" y1="215" x2="680" y2="215"/><line x1="120" y1="255" x2="680" y2="255"/>
  </g>
  <!-- cornice -->
  <rect x="108" y="158" width="584" height="22" fill="#241C14"/>
  <!-- roof sign board -->
  <rect x="252" y="92" width="296" height="66" fill="#D19A3E" stroke="#241C14" stroke-width="4"/>
  <text x="400" y="138" font-size="38" fill="#241C14" text-anchor="middle" letter-spacing="3">MAIN ST. EATS</text>
  <!-- striped awning valance -->
  <g>
    <rect x="150" y="322" width="500" height="30" fill="#241C14"/>
    <g>
      <rect x="150" y="322" width="50" height="30" fill="#F1E7CE"/>
      <rect x="250" y="322" width="50" height="30" fill="#F1E7CE"/>
      <rect x="350" y="322" width="50" height="30" fill="#F1E7CE"/>
      <rect x="450" y="322" width="50" height="30" fill="#F1E7CE"/>
      <rect x="550" y="322" width="50" height="30" fill="#F1E7CE"/>
    </g>
    <!-- scalloped bottom -->
    <g fill="#241C14">
      <path d="M150 352 l25 22 l25 -22 Z"/><path d="M200 352 l25 22 l25 -22 Z"/><path d="M250 352 l25 22 l25 -22 Z"/>
      <path d="M300 352 l25 22 l25 -22 Z"/><path d="M350 352 l25 22 l25 -22 Z"/><path d="M400 352 l25 22 l25 -22 Z"/>
      <path d="M450 352 l25 22 l25 -22 Z"/><path d="M500 352 l25 22 l25 -22 Z"/><path d="M550 352 l25 22 l25 -22 Z"/>
      <path d="M600 352 l25 22 l25 -22 Z"/>
    </g>
  </g>
  <!-- lit windows -->
  <g>
    <rect x="168" y="384" width="176" height="90" fill="#D19A3E"/>
    <rect x="168" y="384" width="176" height="90" fill="none" stroke="#241C14" stroke-width="4"/>
    <line x1="256" y1="384" x2="256" y2="474" stroke="#241C14" stroke-width="3"/>
    <line x1="168" y1="429" x2="344" y2="429" stroke="#241C14" stroke-width="3"/>

    <rect x="456" y="384" width="176" height="90" fill="#D19A3E"/>
    <rect x="456" y="384" width="176" height="90" fill="none" stroke="#241C14" stroke-width="4"/>
    <line x1="544" y1="384" x2="544" y2="474" stroke="#241C14" stroke-width="3"/>
    <line x1="456" y1="429" x2="632" y2="429" stroke="#241C14" stroke-width="3"/>
  </g>
  <!-- door -->
  <rect x="366" y="378" width="68" height="96" fill="#241C14"/>
  <rect x="378" y="392" width="44" height="34" fill="#D19A3E"/>
  <!-- OPEN sign -->
  <rect x="384" y="436" width="32" height="18" fill="#1E3A2F" stroke="#D19A3E" stroke-width="1.5"/>
  <text x="400" y="450" font-size="11" fill="#D19A3E" text-anchor="middle" letter-spacing="1">OPEN</text>
  <!-- lamppost -->
  <rect x="74" y="300" width="8" height="174" fill="#241C14"/>
  <circle cx="78" cy="292" r="16" fill="#D19A3E"/>
  <circle cx="78" cy="292" r="26" fill="#D19A3E" opacity="0.22"/>
</svg>
